name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: dotnet build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build solution
        run: dotnet build CSharpLabsCoursework.slnx --configuration Release

      - name: Run tests
        run: dotnet test tests/RequestRegistry.Tests/RequestRegistry.Tests.csproj --configuration Release --no-build

      - name: Check formatting
        run: dotnet format CSharpLabsCoursework.slnx --verify-no-changes --severity error --no-restore
